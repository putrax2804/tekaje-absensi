<style>
* {

body {

select,

}

.camera-controls {

.photo-preview {

}

.photo-preview img {

.photo-status {

}

.table-wrap {

}

table {

th,

th {
    color: #00eaff;

.table-photo {

}

.badge {

}

.hadir {

.sakit {

.izin {

.alpa {

}

.actions {

}

@media(max-width:700px) {

    }

        flex-direction: column;
    }

        padding: 15px;
    }
}

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";


// =====================================================
// THREE.JS BACKGROUND
// =====================================================

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.z = 7;


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


document
    .getElementById("scene")
    .appendChild(
        renderer.domElement
    );


// PARTICLES

const geometry =
    new THREE.BufferGeometry();

const particleCount = 500;

const positions =
    new Float32Array(
        particleCount * 3
    );


for(
    let i = 0;
    i < particleCount;
    i++
){

    positions[i * 3] =
        (Math.random() - .5) * 20;

    positions[i * 3 + 1] =
        (Math.random() - .5) * 15;

    positions[i * 3 + 2] =
        (Math.random() - .5) * 10;

}


geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


const material =
    new THREE.PointsMaterial({

        color: 0x00eaff,

        size: .035,

        transparent: true,

        opacity: .75

    });


const particles =
    new THREE.Points(
        geometry,
        material
    );


scene.add(particles);


// WIREFRAME

const boxGeometry =
    new THREE.IcosahedronGeometry(
        2.3,
        1
    );


const boxMaterial =
    new THREE.MeshBasicMaterial({

        color: 0x00eaff,

        wireframe: true,

        transparent: true,

        opacity: .12

    });


const object =
    new THREE.Mesh(
        boxGeometry,
        boxMaterial
    );


scene.add(object);


function animate(){

    requestAnimationFrame(
        animate
    );

    particles.rotation.y += .0007;

    particles.rotation.x += .0002;

    object.rotation.x += .001;

    object.rotation.y += .0015;

    renderer.render(
        scene,
        camera
    );

}


animate();


window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// =====================================================
// JAM
// =====================================================

function updateClock(){

    const now =
        new Date();

    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleString(
            "id-ID",
            {
                dateStyle: "full",
                timeStyle: "medium"
            }
        );

}


setInterval(
    updateClock,
    1000
);

updateClock();


// =====================================================
// DATA
// =====================================================

let attendance =
    JSON.parse(
        localStorage.getItem(
            "tkjAttendance"
        )
    ) || [];


// =====================================================
// KOORDINAT SEKOLAH
// =====================================================

// ⚠️ GANTI DENGAN KOORDINAT SEKOLAH YANG BENAR.

const SCHOOL_LAT =
    -6.274532;

const SCHOOL_LON =
    107.0809121;


// Radius maksimal
// dalam meter.

const MAX_DISTANCE =
    50;


// =====================================================
// KAMERA
// =====================================================

let cameraStream = null;

let photoData = null;


window.startCamera =
async function(){

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        const video =
            document.getElementById(
                "camera"
            );


        video.srcObject =
            cameraStream;


        document.getElementById(
            "cameraBox"
        ).style.display =
            "block";


        document.getElementById(
            "photoStatus"
        ).textContent =
            "📷 Kamera aktif. Arahkan kamera lalu tekan Ambil Foto.";

    }

    catch(error){

        document.getElementById(
            "photoStatus"
        ).textContent =
            "❌ Kamera tidak bisa digunakan. Izinkan akses kamera.";

        console.error(error);

    }

};


window.takePhoto =
function(){

    const video =
        document.getElementById(
            "camera"
        );


    if(
        !cameraStream ||
        !video.videoWidth
    ){

        alert(
            "Buka kamera terlebih dahulu."
        );

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Kompres foto agar localStorage
    // tidak cepat penuh.

    photoData =
        canvas.toDataURL(
            "image/jpeg",
            0.75
        );


    document.getElementById(
        "photoImage"
    ).src =
        photoData;


    document.getElementById(
        "photoPreview"
    ).style.display =
        "block";


    document.getElementById(
        "photoStatus"
    ).textContent =
        "✅ Foto berhasil diambil.";

};


window.stopCamera =
function(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream =
            null;

    }


    document.getElementById(
        "cameraBox"
    ).style.display =
        "none";

};


// =====================================================
// HITUNG JARAK GPS
// =====================================================

function distance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6000;


    const p1 =
        lat1 *
        Math.PI /
       180;


    const p2 =
        lat2 *
        Math.PI /
        180;


    const dp =
        (lat2 - lat1) *
        Math.PI /
        180;


    const dl =
        (lon2 - lon1) *
        Math.PI /
        180;


    const a =
        Math.sin(dp / 2) ** 2 +

        Math.cos(p1) *
        Math.cos(p2) *

        Math.sin(dl / 2) ** 2;


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


// =====================================================
// SIMPAN ABSENSI
// =====================================================

function saveAttendance(
    student,
    status,
    lat = "-",
    lon = "-",
    accuracy = "-",
    jarak = "-"
){

    const now =
        new Date();


    const data = {

        name:
            student,

        status:
            status,

        time:
            now.toLocaleString(
                "id-ID"
            ),

        latitude:
            lat,

        longitude:
            lon,

        accuracy:
            accuracy,

        distance:
            jarak,

        photo:
            photoData

    };


    attendance.push(
        data
    );


    localStorage.setItem(
        "tkjAttendance",
        JSON.stringify(
            attendance
        )
    );


    renderTable();

    updateStats();


    document.getElementById(
        "photoStatus"
    ).textContent =
        "✅ Foto dan absensi berhasil disimpan.";


    stopCamera();

}


// =====================================================
// ABSEN
// =====================================================

window.absen =
function(){

    const student =
        document.getElementById(
            "student"
        ).value;


    const status =
        document.getElementById(
            "status"
        ).value;


    const gpsStatus =
        document.getElementById(
            "gpsStatus"
        );


    // NAMA WAJIB

    if(!student){

        alert(
            "Pilih nama siswa terlebih dahulu!"
        );

        return;

    }


    // FOTO WAJIB

    if(!photoData){

        alert(
            "📸 Foto wajib diambil sebelum absen!"
        );

        return;

    }


    // =================================================
    // SAKIT / IZIN / ALPA
    // TIDAK MEMBUTUHKAN GPS
    // =================================================

    if(status !== "Hadir"){

        gpsStatus.innerHTML =
            "ℹ️ Status " +
            status +
            " tidak membutuhkan GPS.";

        saveAttendance(
            student,
            status
        );

        return;

    }


    // =================================================
    // HADIR
    // GPS WAJIB
    // =================================================

    if(!navigator.geolocation){

        gpsStatus.textContent =
            "❌ Browser tidak mendukung GPS.";

        return;

    }


    gpsStatus.textContent =
        "📡 Mengambil lokasi GPS...";


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;


            const lon =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            const jarak =
                distance(
                    lat,
                    lon,
                    SCHOOL_LAT,
                    SCHOOL_LON
                );


            // DI LUAR RADIUS

            if(
                jarak >
                MAX_DISTANCE
            ){

                gpsStatus.innerHTML =
                    "❌ Di luar radius sekolah.<br>" +
                    "Jarak: " +
                    Math.round(
                        jarak
                    ) +
                    " meter";

                return;

            }


            // DALAM RADIUS

            gpsStatus.innerHTML =
                "✅ Lokasi valid.<br>" +
                "Jarak: " +
                Math.round(
                    jarak
                ) +
                " meter";


            saveAttendance(

                student,

                status,

                lat.toFixed(6),

                lon.toFixed(6),

                Math.round(
                    accuracy
                ),

                Math.round(
                    jarak
                )

            );

        },


        error => {

            let message =
                "❌ GPS gagal digunakan.";


            if(
                error.code === 1
            ){

                message =
                    "❌ Izin lokasi ditolak.";

            }


            if(
                error.code === 2
            ){

                message =
                    "❌ Lokasi tidak tersedia.";

            }


            if(
                error.code === 3
            ){

                message =
                    "❌ GPS terlalu lama merespons.";

            }


            gpsStatus.textContent =
                message;

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                10000,

            maximumAge:
                0

        }

    );

};


// =====================================================
// TABEL
// =====================================================

function renderTable(){

    const table =
        document.getElementById(
            "attendanceTable"
        );


    table.innerHTML =
        "";


    attendance.forEach(
        (item, index) => {

            const tr =
                document.createElement(
                    "tr"
                );


            const className =
                item.status
                    .toLowerCase();


            const photo =
                item.photo
                ?
                `<img
                    class="table-photo"
                    src="${item.photo}"
                    alt="Foto">
                `
                :
                "—";


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${photo}
                </td>

                <td>
                    ${item.name}
                </td>

                <td>
                    <span
                        class="badge ${className}">
                        ${item.status}
                    </span>
                </td>

                <td>
                    ${item.time}
                </td>

                <td>
                    ${item.latitude}
                </td>

                <td>
                    ${item.longitude}
                </td>

            `;


            table.appendChild(
                tr
            );

        }
    );

}


// =====================================================
// STATISTIK
// =====================================================

function updateStats(){

    document.getElementById(
        "totalHadir"
    ).textContent =
        attendance.filter(
            x =>
                x.status ===
                "Hadir"
        ).length;


    document.getElementById(
        "totalSakit"
    ).textContent =
        attendance.filter(
            x =>
                x.status ===
                "Sakit"
        ).length;


    document.getElementById(
        "totalIzin"
    ).textContent =
        attendance.filter(
            x =>
                x.status ===
                "Izin"
        ).length;


    document.getElementById(
        "totalAlpa"
    ).textContent =
        attendance.filter(
            x =>
                x.status ===
                "Alpa"
        ).length;

}


// =====================================================
// HAPUS DATA
// =====================================================

window.clearData =
function(){

    if(
        !confirm(
            "Hapus seluruh data absensi?"
        )
    ){

        return;

    }


    attendance =
        [];


    localStorage.removeItem(
        "tkjAttendance"
    );


    photoData =
        null;


    document.getElementById(
        "photoPreview"
    ).style.display =
        "none";


    document.getElementById(
        "photoImage"
    ).src =
        "";


    document.getElementById(
        "photoStatus"
    ).textContent =
        "📷 Foto belum diambil.";


    renderTable();

    updateStats();


    document.getElementById(
        "gpsStatus"
    ).textContent =
        "Data absensi telah dihapus.";
